# quill configuration for the textbook voice. Same keys as quill.yaml; its own data home, so the
# first corpus is untouched. Use with:  uv run quill --config configs/textbook.yaml <command>

voice: tb                 # reports go to eval_reports/tb/

paths:
  home: ~/.quill/tb
  raw: ~/.quill/raw/systemsapproach/book      # sparse clone of the repository: .rst files only
  legal: ~/.quill/legal
  audit: ~/.quill/tb/audit
  corpus: ~/.quill/tb/corpus
  lexicon: ~/.quill/tb/lexicon
  splits: ~/.quill/tb/splits
  eval: ~/.quill/tb/eval
  baseline: ~/.quill/research/2026-11-08/simpass/corpus

gen:
  route: claude_cli
  util_model: claude-sonnet-5-5
  draft_model: claude-opus-5-5
  workers: 4
  base_model: ~/.quill/models/qwen3-8b-4bit

author:
  name: Larry Peterson and Bruce Davie
  source: "Computer Networks: A Systems Approach (github.com/SystemsApproach/book, CC BY 4.0)"
  register: textbook

corpus:
  source: rst
  source_url: https://github.com/SystemsApproach/book/blob/master
  min_post_words: 120
  twin_ngram: 10
  twin_share: 0.30
  twin_link_min: 0.05
  dedupe: {shingle: 5, jaccard: 0.85, min_words: 20}
  chunk:
    min_words: 150
    max_words: 800
    targets: [400, 225, 650]
    gap_markers: {quote: "<QUOTE>", media: "<IMAGE>"}   # <IMAGE> marks a removed figure, table, code listing or display equation; the name is kept so the pair prompts and code are shared with the first corpus

split:
  version: v1
  clusters: 12
  seed: 0
  test_share: 0.10
  dev_share: 0.07

decisions:
  launch_register: textbook
  data_prep_generator: api
  consent_record: ~/.quill/legal/scope_systemsapproach.yaml
