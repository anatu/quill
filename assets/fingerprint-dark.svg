<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 448" width="860" height="448" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Style habits as a multiple of the author's rate</title><desc>One-sentence paragraphs: A plain assistant draft 0.06x, Claude Opus + style guide 0.85x, quill 0.83x; Words per paragraph: A plain assistant draft 2.15x, Claude Opus + style guide 0.64x, quill 1.25x; Em dashes per 1,000 words: A plain assistant draft 0.01x, Claude Opus + style guide 0.35x, quill 0.68x; Words per sentence: A plain assistant draft 1.10x, Claude Opus + style guide 0.67x, quill 1.04x; Spread of sentence length: A plain assistant draft 0.78x, Claude Opus + style guide 0.67x, quill 0.79x; Questions per 100 sentences: A plain assistant draft 0.29x, Claude Opus + style guide 0.66x, quill 0.41x</desc>
<text x="0" y="20" font-size="16" font-weight="600" fill="#f0efec">A voice has a shape. How close does each system get?</text>
<text x="0" y="40" font-size="12.5" fill="#c3c2b7">Each habit as a multiple of the author&#39;s own rate. On the line is a match. Dev split.</text>
