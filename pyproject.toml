[project]
name = "quill"
version = "0.0.1"
description = "Local style model that rewrites drafts in a target author's voice"
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "pyyaml>=6.0",
    "ruptures>=1.1.10",
    "wordfreq>=3.1.1",
]

[project.scripts]
quill = "quill.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quill"]
