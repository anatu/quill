[project]
name = "quill"
version = "0.0.1"
description = "Local style model that rewrites drafts in a target author's voice"
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "einops>=0.8.2",
    "en-core-web-sm",
    "mlx-lm>=0.32.2",
    "pyyaml>=6.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
    "wordfreq>=3.1.1",
]

[project.scripts]
quill = "quill.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quill"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
